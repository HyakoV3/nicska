name: Problema (bug)
description: Algo não funcionou como esperado
labels: [bug]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes: { label: O que aconteceu, description: "O que você esperava e o que viu. Sem dados pessoais." }
    validations: { required: true }
  - type: textarea
    id: como-repetir
    attributes: { label: Como repetir, description: "Passos curtos." }
  - type: input
    id: versao
    attributes:
      label: Versão do app (Ajustes, rodapé) e do Android
      placeholder: "0.1.0, Android 14, Pixel 7"
  - type: textarea
    id: extra
    attributes:
      label: Capturas de tela ou o relatório do diagnóstico
      description: "Cuidado para não incluir rostos ou dados pessoais."
