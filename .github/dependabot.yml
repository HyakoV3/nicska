version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # majors que exigem migração planejada (o SvelteKit 3 já foi adotado em 2026-11-24)
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      tudo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      tudo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      tudo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /src-tauri/gen/android
    schedule:
      interval: weekly
    groups:
      tudo:
        patterns: ["*"]
        update-types: [minor, patch]
